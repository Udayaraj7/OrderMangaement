_schema-version: 3.3.0
ID: orderManagmentSytem
description: A simple CAP project.
version: 1.0.0
modules:
- name: orderManagmentSytem-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: orderManagmentSytem-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: orderManagmentSytem-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: orderManagmentSytem-db
  parameters:
    buildpack: nodejs_buildpack
- name: orderManagmentSytem-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: orderManagmentSytem-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - admin.zip
      name: admin
      target-path: resources/
    
    - artifacts:
      - allorders.zip
      name: allorders
      target-path: resources/
    - artifacts:
      - approval.zip
      name: approval
      target-path: resources/
    - artifacts:
      - basicproject.zip
      name: basicproject
      target-path: resources/
    - artifacts:
      - basicpage2.zip
      name: basicpage2
      target-path: resources/
    - artifacts:
      - approvers.zip
      name: approvers
      target-path: resources/
- name: admin
  type: html5
  path: app/admin
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: allorders
  type: html5
  path: app/allorders
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: approval
  type: html5
  path: app/approval
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: basicproject
  type: html5
  path: app/basicproject
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: basicpage2
  type: html5
  path: app/basicpage2
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: approvers
  type: html5
  path: app/approvers
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: orderManagmentSytem-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: orderManagmentSytem-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: orderManagmentSytem-html5-service
    service-plan: app-host
- name: orderManagmentSytem-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: orderManagmentSytem-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
